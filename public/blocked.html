<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Stay Focused</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1326;
      font-family: "Inter", system-ui, sans-serif;
      color: #dae2fd;
      padding: 12px;
    }

    .container {
      text-align: center;
      max-width: 480px;
      padding: 48px 32px;
      background: rgba(23, 31, 51, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
    }

    .shield {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
    }

    .shield svg {
      width: 40px;
      height: 40px;
      color: white;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #94A3B8;
      margin-bottom: 32px;
    }

    .pulse-ring {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: #3B82F6;
      margin-bottom: 32px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3B82F6;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    button {
      padding: 12px 32px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #dae2fd;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .button-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
      margin-top: 8px;
    }

    button.btn-primary {
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
      color: white;
      border: none;
      flex: 1;
    }

    button.btn-primary:hover {
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      border: none;
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      flex: 1;
    }

    button.btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main Blocker View -->
    <div id="focusflow-main-view" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
      <div class="shield">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
      </div>
      <h1>Stay Focused</h1>
      <div class="pulse-ring">
        <span class="pulse-dot"></span>
        Focus session in progress
      </div>
      <p>This site is blocked during your Pomodoro session.<br/>Stay on track — you've got this!</p>
      <button id="focusflow-stop-btn">Stop focus session?</button>
    </div>

    <!-- Confirmation View -->
    <div id="focusflow-confirm-view" style="display: none; flex-direction: column; align-items: center; width: 100%;">
      <div class="shield" style="background: linear-gradient(135deg, #ef4444, #f97316); box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <h1>Stop Timer?</h1>
      <p style="margin-bottom: 24px;">Do you want to continue staying focused, or are you sure you want to stop the timer?</p>
      <div class="button-group">
        <button id="focusflow-continue-btn" class="btn-primary">Keep Focusing</button>
        <button id="focusflow-yes-stop-btn" class="btn-danger">Yes, Stop Timer</button>
      </div>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
